<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 214" role="img" aria-labelledby="t d" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <title id="t">下まぶたの裏（眼瞼結膜）の色：普段と貧血</title>
  <desc id="d">下まぶたを下に引いて、その裏（眼瞼結膜）の色を比べた模式図。普段は薄いピンク色で、貧血では白っぽくなる。</desc>
  <style>
    .ln{fill:none;stroke:currentColor;stroke-width:1.8}
    .iris{fill:#555555}
    .lab{fill:currentColor;font-size:16px}
    .sm{fill:currentColor;font-size:13.5px;opacity:.9}
  </style>
  <text class="sm" x="16" y="20">下まぶたを下に引いて、裏（眼瞼結膜）の色を見る（模式）</text>
  <g transform="translate(20 40)">
    <path d="M10 70 Q80 0 150 70 Q80 112 10 70 Z" fill="#FFFFFF" stroke="currentColor" stroke-width="1.8"/>
    <circle class="iris" cx="80" cy="66" r="22"/>
    <path d="M14 82 Q80 120 146 82 Q80 150 14 82 Z" fill="#E59AA2" stroke="currentColor" stroke-width="1.4"/>
    <text class="lab" x="20" y="148">普段</text>
    <text class="sm" x="20" y="168">薄いピンク色</text>
  </g>
  <g transform="translate(220 40)">
    <path d="M10 70 Q80 0 150 70 Q80 112 10 70 Z" fill="#FFFFFF" stroke="currentColor" stroke-width="1.8"/>
    <circle class="iris" cx="80" cy="66" r="22"/>
    <path d="M14 82 Q80 120 146 82 Q80 150 14 82 Z" fill="#F4E6E3" stroke="currentColor" stroke-width="1.4"/>
    <text class="lab" x="20" y="148">貧血</text>
    <text class="sm" x="20" y="168">白っぽい</text>
  </g>
</svg>
