<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-labelledby="t d" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <title id="t">膵臓の位置：体の奥の背中側</title>
  <desc id="d">おなかの上の方を輪切りにした模式図。前（おなか側）に胃があり、その裏側、背骨の前に膵臓がある。膵臓は体の奥の背中側にあるため、異常が見つかりにくい。</desc>
  <style>
    .body{fill:none;stroke:currentColor;stroke-width:2.2}
    .org{fill:currentColor;opacity:.12;stroke:currentColor;stroke-width:1.4}
    .key{fill:currentColor;opacity:.35;stroke:currentColor;stroke-width:2.4}
    .bone{fill:none;stroke:currentColor;stroke-width:2.4}
    .lab{fill:currentColor;font-size:16px}
    .sm{fill:currentColor;font-size:13.5px;opacity:.9}
  </style>
  <text class="sm" x="16" y="20">おなかの上の方を輪切りにした図（模式）</text>
  <text class="sm" x="150" y="44">おなか側（前）</text>
  <ellipse class="body" cx="200" cy="150" rx="170" ry="96"/>
  <ellipse class="org" cx="236" cy="98" rx="70" ry="32"/>
  <text class="lab" x="226" y="104">胃</text>
  <path class="key" d="M124 158 Q160 142 210 148 Q250 152 272 140 Q284 148 272 162 Q240 172 200 168 Q160 170 130 174 Q116 168 124 158 Z"/>
  <text class="lab" x="160" y="166">膵臓</text>
  <ellipse class="org" cx="102" cy="204" rx="24" ry="26"/>
  <ellipse class="org" cx="298" cy="204" rx="24" ry="26"/>
  <text class="sm" x="82" y="209">腎臓</text>
  <text class="sm" x="278" y="209">腎臓</text>
  <circle class="bone" cx="200" cy="210" r="24"/>
  <text class="sm" x="184" y="215">背骨</text>
  <text class="sm" x="152" y="264">背中側（後ろ）</text>
  <text class="sm" x="16" y="296">膵臓は胃の裏側、背骨の前にある</text>
  <text class="sm" x="16" y="316">体の奥の背中側にあるため、異常が見つかりにくい</text>
</svg>
