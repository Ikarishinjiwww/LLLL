<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-labelledby="t d" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <title id="t">喘息の発作で気道が狭くなるしくみ</title>
  <desc id="d">健康な気道と喘息の発作時の気道を、断面で比べた模式図。発作時には、気道の粘膜がむくみ、気管支のまわりの筋肉が収縮し、痰がたまることで、空気の通り道が狭くなる。喘息の基盤には慢性の気道炎症がある。</desc>
  <style>
    .mus{fill:none;stroke:currentColor;stroke-width:3;stroke-dasharray:6 3}
    .muc{fill:currentColor;opacity:.18;stroke:currentColor;stroke-width:1.4}
    .air{fill:#FFFFFF;stroke:currentColor;stroke-width:1.4}
    .phl{fill:#333333}
    .lab{fill:currentColor;font-size:16px}
    .sm{fill:currentColor;font-size:13.5px;opacity:.9}
  </style>
  <text class="sm" x="16" y="20">気道の断面（模式）。白い部分が空気の通り道</text>
  <g transform="translate(100 120)">
    <circle class="mus" r="70"/>
    <circle class="muc" r="64"/>
    <circle class="air" r="50"/>
    <text class="lab" x="-40" y="104">健康な気道</text>
  </g>
  <g transform="translate(300 120)">
    <circle class="mus" r="60" style="stroke-width:5"/>
    <circle class="muc" r="56"/>
    <circle class="air" r="20"/>
    <ellipse class="phl" cx="-6" cy="4" rx="8" ry="5"/>
    <ellipse class="phl" cx="8" cy="-6" rx="5" ry="4"/>
    <text class="lab" x="-72" y="104">喘息の発作時の気道</text>
  </g>
  <text class="sm" x="16" y="250">点線：気管支のまわりの筋肉　灰色：粘膜　黒い粒：痰</text>
  <text class="lab" x="16" y="282">発作時に気道が狭くなる3つの理由</text>
  <text class="lab" x="16" y="308">① 粘膜がむくむ</text>
  <text class="lab" x="16" y="332">② 気管支のまわりの筋肉が収縮する</text>
  <text class="lab" x="16" y="356">③ 痰がたまる</text>
  <text class="lab" x="16" y="384">→ 気道が狭くなる（→ は原因と結果）</text>
  <text class="sm" x="16" y="410">基盤には、慢性の気道炎症がある</text>
</svg>
