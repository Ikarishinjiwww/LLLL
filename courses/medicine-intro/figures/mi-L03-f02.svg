<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <title id="t">C型肝炎から肝硬変・肝がんへ</title>
  <desc id="d">C型肝炎ウイルスに感染したあとの経過を示す流れ図。約30%は自然にウイルスが排除され、約70%は慢性肝炎になる。慢性肝炎の一部は長い年月をかけて肝硬変に進む。肝がんは肝硬変から発生することが多いが、肝硬変を経ずに発生することもある。図中の割合・年数（約20年・約10年）・肝臓の重さは、配布資料の経過図に示された例である。肝硬変は一般に元の肝臓には戻らない。</desc>
  <style>
    .box{fill:none;stroke:currentColor;stroke-width:1.8}
    .key{fill:none;stroke:currentColor;stroke-width:2.8}
    .lab{fill:currentColor;font-size:14px}
    .sm{fill:currentColor;font-size:12.5px;opacity:.85}
    .ln{fill:none;stroke:currentColor;stroke-width:1.8}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
  <rect class="box" x="200" y="16" width="240" height="40" rx="8"/>
  <text class="lab" x="232" y="42">C型肝炎ウイルスに感染</text>
  <path class="ln" d="M280 56 L150 96" marker-end="url(#a)"/>
  <path class="ln" d="M360 56 L440 96" marker-end="url(#a)"/>
  <text class="sm" x="168" y="80">約30%</text>
  <text class="sm" x="420" y="80">約70%</text>
  <rect class="box" x="20" y="100" width="250" height="46" rx="8"/>
  <text class="lab" x="36" y="128">ウイルスが自然に排除される</text>
  <rect class="box" x="330" y="100" width="290" height="46" rx="8"/>
  <text class="lab" x="346" y="122">慢性肝炎</text>
  <text class="sm" x="346" y="139">症状が出にくく、採血で見つかる</text>
  <path class="ln" d="M475 146 V196" marker-end="url(#a)"/>
  <text class="sm" x="485" y="176">一部が約20年（例）</text>
  <rect class="key" x="330" y="200" width="290" height="58" rx="8"/>
  <text class="lab" x="346" y="224">肝硬変（重さ約1,300g→約850g）</text>
  <text class="sm" x="346" y="244">線維が増え、肝臓が硬く小さくなる</text>
  <path class="ln" d="M475 258 V308" marker-end="url(#a)"/>
  <text class="sm" x="485" y="288">約10年（例）</text>
  <rect class="key" x="330" y="312" width="290" height="40" rx="8"/>
  <text class="lab" x="346" y="338">肝がんの発生</text>
  <path class="ln" d="M620 140 C 638 190, 638 290, 621 318" marker-end="url(#a)"/>
  <text class="sm" x="20" y="214">・線維化が進むほど、肝がんが発生しやすい</text>
  <text class="sm" x="20" y="236">・肝硬変は、一般に元の肝臓には戻らない</text>
  <text class="sm" x="20" y="258">・肝硬変では黄疸・腹水・食道静脈瘤がみられる</text>
  <text class="sm" x="20" y="280">・肝硬変を経ずに肝がんが発生することもある（右の矢印）</text>
  <text class="sm" x="20" y="392">現在は飲み薬の抗ウイルス薬で、多くの人がウイルスを排除できる。</text>
  <text class="sm" x="20" y="416">割合・年数・肝臓の重さは、配布資料の経過図に示された例である。</text>
</svg>
